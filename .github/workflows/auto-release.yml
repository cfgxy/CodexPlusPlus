name: Auto release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "可选：覆盖发布 tag（测试用，如 v0.0.0-test）；留空则按 Cargo.toml 版本号"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # main push 不再触发 pr-build.yml，发布链的脚本测试改由本工作流自己跑：
  # 判定脚本出错会直接造成错误发布，不能只在 PR 上把关。
  release-scripts:
    uses: ./.github/workflows/release-scripts.yml

  plan:
    name: Plan release action
    # 判定脚本没通过测试就不进入发布：它决定 Release 建不建、资产删不删。
    needs: release-scripts
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      create_release: ${{ steps.decide.outputs.create_release }}
      build_assets: ${{ steps.decide.outputs.build_assets }}
      cleanup_assets: ${{ steps.decide.outputs.cleanup_assets }}
      stale_assets: ${{ steps.decide.outputs.stale_assets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        env:
          OVERRIDE_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE_TAG" ]; then
            echo "tag=$OVERRIDE_TAG" >> "$GITHUB_OUTPUT"
            echo "release tag: $OVERRIDE_TAG（来自 workflow_dispatch 覆盖）"
            exit 0
          fi
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/ { s/^version = "\(.*\)"$/\1/p }' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::无法从 Cargo.toml [workspace.package] 读取版本号"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release tag: v$version"

      - name: Collect release state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > assets.txt 2>/dev/null; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            : > assets.txt
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "remote_tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote_tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide release action
        id: decide
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.state.outputs.release_exists }}
          REMOTE_TAG_EXISTS: ${{ steps.state.outputs.remote_tag_exists }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$(cat assets.txt)" bash scripts/release/decide-release-action.sh

  create-release:
    name: Create release
    needs: plan
    if: needs.plan.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "$TAG" --generate-notes
          echo "Release $TAG 已创建。"

  # 删除期望清单之外的错误/陈旧资产。必须早于 release-assets：
  # 否则错误资产会被 latest.json 收录，使更新元数据指向不存在或错误的文件。
  # 仅删除 Release 资产（contents: write 即可），不触碰 tag、commit 与 Release 本身，
  # 删错也可由后续构建重新上传，属可恢复操作。
  cleanup-assets:
    name: Remove stale release assets
    needs: [plan, create-release]
    if: always() && needs.plan.outputs.cleanup_assets == 'true' && needs.create-release.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          STALE: ${{ needs.plan.outputs.stale_assets }}
        shell: bash
        run: |
          set -euo pipefail
          # 逐行读取：资产名本身可能含逗号，逗号分隔会把一个文件名拆成
          # 两个不存在的名字，删除失败或漏删。
          count=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            echo "删除错误/陈旧资产：$name"
            # 删除失败即显式失败：残留错误资产会污染 latest.json。
            gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes
            count=$((count + 1))
          done <<< "$STALE"
          echo "已清理 $count 项资产。"

  # 用 workflow_call 直接嵌套调用资产构建，而不是 `gh workflow run` 派发：
  # GITHUB_TOKEN 没有 actions:write，派发会以 HTTP 403 失败（见 run 34015804532），
  # 且 GITHUB_TOKEN 创建的 release 也不会触发 release: published 事件。
  release-assets:
    name: Build release assets
    needs: [plan, create-release, cleanup-assets]
    # create-release 与 cleanup-assets 各自在不需要时被跳过，因此用 always()
    # 配合显式失败判断，避免 skipped 依赖把整条链静默带过。
    if: >-
      always() && needs.plan.outputs.build_assets == 'true'
      && needs.create-release.result != 'failure'
      && needs.cleanup-assets.result != 'failure'
    uses: ./.github/workflows/release-assets.yml
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.plan.outputs.tag }}

  verify:
    name: Verify release assets
    needs: [plan, create-release, cleanup-assets, release-assets]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # 任一上游 job 失败都必须让本次发布显式失败，
      # 不得把“Release 已创建”当作发布成功。
      - name: Fail on upstream failure
        if: >-
          needs.create-release.result == 'failure'
          || needs.cleanup-assets.result == 'failure'
          || needs.release-assets.result == 'failure'
        shell: bash
        run: |
          echo "::error::发布链失败：create-release=${{ needs.create-release.result }}, cleanup-assets=${{ needs.cleanup-assets.result }}, release-assets=${{ needs.release-assets.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify assets complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > assets.txt
          echo "Release $TAG 当前资产："
          sed 's/^/  /' assets.txt
          # 复用同一判定脚本：资产严格齐全（无缺件、无多余）时它会同时输出
          # build_assets=false 与 cleanup_assets=false。
          out="$(ASSETS="$(cat assets.txt)" RELEASE_EXISTS=true REMOTE_TAG_EXISTS=true \
            bash scripts/release/decide-release-action.sh)"
          echo "$out"
          if ! grep -q '^build_assets=false$' <<<"$out"; then
            echo "::error::Release $TAG 资产仍不完整，发布未成功。"
            exit 1
          fi
          # 多余资产同样使 Release 不合格：它们会被 latest.json 收录。
          if ! grep -q '^cleanup_assets=false$' <<<"$out"; then
            echo "::error::Release $TAG 仍存在错误或陈旧资产，发布未成功。"
            exit 1
          fi
          echo "Release $TAG 资产严格完整。"
